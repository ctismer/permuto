[project]
name = "permuto"
version = "0.1.0"
description = "Polytop / Permutograph viewer — a Modula-2 (1990-95) program recovered and ported to Python/PySide6"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Christian Tismer-Sperling", email = "tismer@stackless.com" }]
keywords = ["permutograph", "permutohedron", "visualization", "PySide6", "Gotthard Günther"]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/ctismer/permuto"
Source = "https://github.com/ctismer/permuto"

[project.scripts]
permuto = "permuto.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the hand-written PostScript preamble that makes an export runnable
"permuto.formats" = ["poly.pre"]
# the named sample graphs, so "permuto show pgl4" works from a plain install
"permuto.data" = ["nod/*.nod", "nod/*.pgd"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
