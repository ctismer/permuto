[project]
name = "permuto"
version = "0.1.0"
description = "Polytop / Permutograph viewer — a Modula-2 (1990-95) program recovered and ported to Python/PySide6"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Christian Tismer-Sperling", email = "tismer@stackless.com" }]
license = { file = "LICENSE" }
keywords = ["permutograph", "permutohedron", "visualization", "PySide6", "Gotthard Günther"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
# mypy belongs here: tests/test_annotations.py shells out to it and *skips*
# where it is absent, so leaving it out means the type check quietly does not
# happen.  The CI installs this extra rather than a hand-written list, so the
# two cannot drift apart.
test = ["pytest", "mypy"]

[project.urls]
Homepage = "https://github.com/ctismer/permuto"
Source = "https://github.com/ctismer/permuto"

[project.scripts]
permuto = "permuto.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the hand-written PostScript preamble that makes an export runnable
"permuto.formats" = ["poly.pre"]
# the named sample graphs, so "permuto show pgl4" works from a plain install
"permuto.data" = ["nod/*.nod", "nod/*.pgd"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# Default strictness on purpose.  It is clean, and it catches what actually
# went wrong here: an annotation naming something that does not exist, a slot
# that only ever held None, a menu handed the wrong menu's action.  --strict
# would add 243 "missing annotation" complaints, which is a different project
# and the fastest way to teach everyone to ignore the checker.
files = ["src/permuto"]
python_version = "3.10"
pretty = true

[[tool.mypy.overrides]]
# PySide6 ships stubs, but not for everything it exposes at run time.
module = ["PySide6.*"]
follow_imports = "skip"
